<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDS Component Dependency Graph</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background: #0f1117; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

  header { padding: 14px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #1e2535; background: #0f1117; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; color: #f1f5f9; }
  header span { font-size: 12px; color: #64748b; }

  #cy { flex: 1; width: 100%; }

  .controls { position: absolute; top: 64px; right: 16px; display: flex; flex-direction: column; gap: 6px; }
  .btn { background: #1e2535; border: 1px solid #2d3a52; color: #94a3b8; font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: background .15s; }
  .btn:hover { background: #2d3a52; color: #e2e8f0; }

  .legend { position: absolute; bottom: 20px; left: 16px; background: #1e2535cc; backdrop-filter: blur(8px); border: 1px solid #2d3a52; border-radius: 8px; padding: 10px 14px; font-size: 12px; }
  .legend-title { font-weight: 600; margin-bottom: 8px; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: #cbd5e1; }
  .legend-divider { border-top: 1px solid #2d3a52; margin: 8px 0; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .swatch-border { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; border: 2.5px solid; background: transparent; }

  .tooltip { position: absolute; background: #1e2535; border: 1px solid #2d3a52; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #e2e8f0; pointer-events: none; display: none; max-width: 220px; box-shadow: 0 4px 16px #00000066; }
  .tooltip strong { display: block; margin-bottom: 4px; font-size: 13px; }
  .tooltip .meta { color: #64748b; font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>PDS Component Dependency Graph</h1>
  <span>30 components &middot; 38 dependencies</span>
</header>

<div id="cy"></div>

<div class="controls">
  <button class="btn" onclick="cy.fit(null, 32)">Fit</button>
  <button class="btn" onclick="cy.zoom(cy.zoom() * 1.2)">+</button>
  <button class="btn" onclick="cy.zoom(cy.zoom() / 1.2)">−</button>
</div>

<div class="legend">
  <div class="legend-title">Depth level</div>
  <div class="legend-item"><span class="swatch" style="background:#f472b6"></span>Root (highest)</div>
  <div class="legend-item"><span class="swatch" style="background:#a78bfa"></span>Depth 2</div>
  <div class="legend-item"><span class="swatch" style="background:#7b68ee"></span>Depth 1</div>
  <div class="legend-item"><span class="swatch" style="background:#4f9cf9"></span>Leaf (no deps)</div>

  <div class="legend-divider"></div>

  <div class="legend-title">Migration status</div>
  <div class="legend-item"><span class="swatch-border" style="border-color:#22c55e"></span>Merged</div>
  <div class="legend-item"><span class="swatch-border" style="border-color:#f59e0b"></span>PR Open</div>
  <div class="legend-item"><span class="swatch-border" style="border-color:#60a5fa"></span>In Progress</div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
